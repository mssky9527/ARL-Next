name: Build and Push to Aliyun ACR

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger

env:
  ALIYUN_REGISTRY: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: owl234-arl-prod

jobs:
  push-official-images:
    if: github.repository == 'owl234/ARL-Next'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Pull and Push Official Images
        run: |
          docker pull mongo:7.0
          docker tag mongo:7.0 ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/mongo:7.0
          docker push ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/mongo:7.0
          
          docker pull rabbitmq:3-alpine
          docker tag rabbitmq:3-alpine ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/rabbitmq:3-alpine
          docker push ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/rabbitmq:3-alpine

          docker pull willfarrell/autoheal:latest
          docker tag willfarrell/autoheal:latest ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/autoheal:latest
          docker push ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/autoheal:latest

  build-frontend:
    if: github.repository == 'owl234/ARL-Next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/arl-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-worker:
    if: github.repository == 'owl234/ARL-Next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Pre-build check for critical deployment files
        run: |
          if ! grep -q "COPY ./version.txt ./start-prod.sh ./docker-compose.prod.yml /code/" Dockerfile.prod; then
            echo "::error::Dockerfile.prod is missing the critical COPY instruction for deployment scripts. This will break the domestic one-click deployment!"
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push Web and Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/arl-web:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/arl-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-puppeteer:
    if: github.repository == 'owl234/ARL-Next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push Puppeteer Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.puppeteer
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/arl-puppeteer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-osint:
    if: github.repository == 'owl234/ARL-Next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push OSINT Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/osint_service
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/osint-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    if: github.repository == 'owl234/ARL-Next' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-frontend, build-web-worker, build-puppeteer, build-osint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract Changelog for Current Tag
        id: extract_notes
        run: |
          TAG="${{ github.ref_name }}"
          python3 -c "
          import re, sys

          tag = '$TAG'
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s*\[?{re.escape(tag)}\]?.*?\n(.*?)(?=\n##\s*\[?v|\Z)'
              match = re.search(pattern, content, re.DOTALL | re.IGNORECASE)
              if match:
                  notes = match.group(1).strip()
                  notes = re.sub(r'\n---+\s*$', '', notes).strip()
          except Exception as e:
              print(f'Error reading CHANGELOG.md: {e}')

          if notes:
              print(f'Found changelog section for {tag}')
              with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as rf:
                  rf.write(notes)
              with open(sys.argv[1] if len(sys.argv) > 1 else '/dev/null', 'a') as ef:
                  ef.write('has_custom_notes=true\n')
          else:
              print(f'No matching changelog section found for {tag}')
              with open(sys.argv[1] if len(sys.argv) > 1 else '/dev/null', 'a') as ef:
                  ef.write('has_custom_notes=false\n')
          " "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.extract_notes.outputs.has_custom_notes == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

