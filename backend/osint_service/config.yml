system:
  host: 0.0.0.0
  port: 16181
  http_client_timeout: 30
  web_ui: true
  detail_concurrency: 5
  # [注意] 任务并发数(task_concurrency) 已剥离。
  # 请前往 ARL-Next 前端界面的【系统设置 -> 性能与并发配置】页面中进行动态调整。
captcha:
  enable: true
  save_failed_img: false
  save_failed_img_path: faile_captcha
  retry_times: 10
proxy:
  local_ipv6_pool:
    enable: false
    pool_num: 88
    check_interval: 1
    ipv6_network_card: eth0
  tunnel:
    url: null
  extra_api:
    url: null
    extra_interval: 3
    timeout: 100
    timeout_drop: 8
    check_proxy: true
    proxy_timeout: 0.5
    check_proxy_num: 20
    auto_maintenace: true
    pool_num: 100
risk_avoidance:
  allow_type:
  - web
  - app
  - mapp
  - kapp
  - bweb
  - bapp
  - bmapp
  - bkapp
  prohibit_suffix: []
log:
  dir: logs
  file_head: ymicp
  backup_count: 7
  save_log: false
  output_console: true
history:
  save_query_history: false
